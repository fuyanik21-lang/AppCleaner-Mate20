name: Build AutoClose APK

on:
  push:
    branches: [ "autoclose-apk" ]
    paths:
      - "autoclose_payload/**"
      - ".github/workflows/autoclose-apk.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "autoclose_payload/**"
      - ".github/workflows/autoclose-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild AutoClose project archive
        shell: bash
        run: |
          cat autoclose_payload/part_* > AutoCloseProject.b64
          base64 -d AutoCloseProject.b64 > AutoCloseProject.zip
          unzip -q AutoCloseProject.zip
          test -f AppCleaner-Mate20-TAM-PROJE/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and build unsigned release APK
        run: gradle -p AppCleaner-Mate20-TAM-PROJE --no-daemon clean testDebugUnitTest assembleRelease --stacktrace

      - name: Verify output
        shell: bash
        run: |
          ls -lah AppCleaner-Mate20-TAM-PROJE/app/build/outputs/apk/release/
          test -f AppCleaner-Mate20-TAM-PROJE/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned AutoClose APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClose-v1.2-active-unsigned
          path: AppCleaner-Mate20-TAM-PROJE/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
