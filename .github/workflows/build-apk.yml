name: Build AutoClose APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - "ci/autoclose_zip_parts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct and verify AutoClose project
        run: |
          cat ci/autoclose_zip_parts/*.txt | base64 --decode > /tmp/autoclose-project.zip
          unzip -t /tmp/autoclose-project.zip
          unzip -q /tmp/autoclose-project.zip

      - name: Test and build unsigned release APK
        run: gradle -p AppCleaner-Mate20-TAM-PROJE --no-daemon clean testDebugUnitTest assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClose-v1.2-active-unsigned
          path: AppCleaner-Mate20-TAM-PROJE/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
