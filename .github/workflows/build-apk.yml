name: Build App Cleaner APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "AppCleaner-Mate20-TAM-PROJE.zip"
      - "ci/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip -q AppCleaner-Mate20-TAM-PROJE.zip

      - name: Apply storage cleaner v1.1
        run: |
          python3 ci/storage_patch_v11_part1.py AppCleaner-Mate20-TAM-PROJE
          python3 ci/storage_patch_v11_part2a.py AppCleaner-Mate20-TAM-PROJE
          python3 ci/storage_patch_v11_part2b.py AppCleaner-Mate20-TAM-PROJE

      - name: Patch Compose imports
        run: |
          sed -i '/import androidx.compose.foundation.layout.weight/d' AppCleaner-Mate20-TAM-PROJE/app/src/main/java/com/personal/appcleaner/ui/screens/CleanScreen.kt
          sed -i '/import androidx.compose.foundation.layout.weight/d' AppCleaner-Mate20-TAM-PROJE/app/src/main/java/com/personal/appcleaner/ui/screens/SettingsScreen.kt

      - name: Test and build APKs
        run: gradle -p AppCleaner-Mate20-TAM-PROJE --no-daemon clean testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCleaner-Huawei-Mate20-v1.1-debug
          path: AppCleaner-Mate20-TAM-PROJE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCleaner-Huawei-Mate20-v1.1-release
          path: AppCleaner-Mate20-TAM-PROJE/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
