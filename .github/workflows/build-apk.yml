name: Build App Cleaner APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "AppCleaner-Huawei-Mate20.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip -q AppCleaner-Huawei-Mate20.zip

      - name: Build debug APK
        run: gradle -p AppCleaner --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCleaner-Huawei-Mate20-debug
          path: AppCleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
